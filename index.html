<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#111318">
<title>Iron Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #111318;
  --bg2:       #1a1d24;
  --bg3:       #22262f;
  --border:    #2e333e;
  --border2:   #3a404e;
  --txt1:      #f0f2f7;   /* primary text — near white */
  --txt2:      #9ba3b5;   /* secondary — readable grey */
  --txt3:      #5c6478;   /* tertiary — dim labels */
  --accent:    #4f7fff;   /* blue action colour */
  --accent2:   #7b5fff;   /* purple accent */
  --green:     #22c55e;
  --yellow:    #facc15;
  --red:       #f87171;
  --r:         14px;      /* card radius */
  --rs:        10px;      /* small radius */
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--txt1);
  font-family:'Barlow',system-ui,sans-serif; overscroll-behavior:none;
  font-size:16px; -webkit-font-smoothing:antialiased; }
input,button,select { font-family:'Barlow',system-ui,sans-serif; }
input { background:none; border:none; outline:none; color:var(--txt1); }
input::placeholder { color:var(--txt3); }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
::-webkit-scrollbar { width:0; }

@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
@keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes scaleIn{ from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }

/* ══ LAYOUT ══ */
#app { display:flex; flex-direction:column; height:100%; max-width:480px; margin:0 auto; }
#header { flex-shrink:0; background:var(--bg); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:200; }
#content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

/* ══ HEADER ══ */
.hdr-inner {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px 12px;
}
.logo-mark {
  font-family:'Barlow Condensed'; font-size:26px; font-weight:900;
  letter-spacing:1px; color:var(--txt1); line-height:1;
}
.logo-mark span { color:var(--accent); }
.nav-pills { display:flex; background:var(--bg3); border-radius:10px; padding:3px; gap:2px; }
.nav-btn {
  background:transparent; border:none; color:var(--txt3);
  padding:7px 18px; border-radius:8px; cursor:pointer;
  font-size:14px; font-weight:700; letter-spacing:.3px;
  transition:all .18s; -webkit-appearance:none;
}
.nav-btn.active { background:var(--accent); color:#fff; }

/* ══ PAGE WRAPPER ══ */
.page { padding:20px; animation:fadeUp .22s ease; }

/* ══ START SCREEN ══ */
.start-hero {
  text-align:center; padding:36px 0 28px;
}
.start-emoji { font-size:64px; line-height:1; margin-bottom:14px; }
.start-h { font-family:'Barlow Condensed'; font-size:40px; font-weight:900;
  color:var(--txt1); letter-spacing:.5px; line-height:1; }
.start-date { font-size:15px; color:var(--txt2); margin-top:8px; margin-bottom:32px; font-weight:500; }

.btn-cta {
  width:100%; padding:18px; border:none; border-radius:var(--r); cursor:pointer;
  font-size:17px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
  background:var(--accent); color:#fff; -webkit-appearance:none;
  transition:opacity .15s, transform .1s;
}
.btn-cta:active { opacity:.85; transform:scale(.98); }
.btn-cta.green { background:var(--green); }

/* ══ LAST SESSION CARD ══ */
.last-wrap { margin-top:28px; }
.label-sm { font-size:12px; font-weight:700; color:var(--txt3); letter-spacing:1.5px;
  text-transform:uppercase; margin-bottom:10px; }
.summary-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:18px;
}
.summary-date { font-size:15px; font-weight:700; color:var(--txt1); margin-bottom:6px; }
.summary-exs { font-size:14px; color:var(--txt2); line-height:1.8; margin-bottom:10px; font-weight:500; }
.summary-stats { display:flex; gap:20px; }
.stat-pill {
  background:var(--bg3); border-radius:8px; padding:8px 14px; text-align:center;
}
.stat-val { font-size:18px; font-weight:800; color:var(--txt1); }
.stat-lbl { font-size:11px; color:var(--txt3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-top:1px; }

/* ══ SESSION HEADER BAR ══ */
.sess-topbar {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:18px;
}
.sess-left {}
.sess-title { font-family:'Barlow Condensed'; font-size:28px; font-weight:900;
  color:var(--txt1); letter-spacing:.5px; line-height:1; }
.sess-sub { font-size:14px; color:var(--txt2); margin-top:4px; font-weight:500; }

/* ══ REST TIMER ══ */
.timer-box {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--rs);
  padding:10px 14px; text-align:center; cursor:pointer; -webkit-appearance:none;
  min-width:72px;
}
.timer-count { font-family:'Barlow Condensed'; font-size:28px; font-weight:900; line-height:1; }
.timer-lbl { font-size:10px; color:var(--txt3); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.timer-idle { font-size:22px; background:none; border:none; cursor:pointer; -webkit-appearance:none; }

/* ══ EXERCISE CARD ══ */
.ex-card {
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:var(--r); margin-bottom:12px; overflow:hidden;
  animation:scaleIn .15s ease;
}
.ex-card.open { border-color:var(--accent); }
.ex-hdr {
  display:flex; align-items:center; gap:14px;
  padding:16px 16px 16px 14px; cursor:pointer;
  -webkit-user-select:none; user-select:none;
}
.ex-icon {
  width:54px; height:54px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:28px;
  background:var(--bg3);
}
.ex-text { flex:1; min-width:0; }
.ex-name { font-size:17px; font-weight:800; color:var(--txt1); line-height:1.2; }
.ex-sub  { font-size:13px; color:var(--txt2); margin-top:4px; font-weight:600; }
.ex-arrow { font-size:14px; color:var(--txt3); flex-shrink:0; transition:transform .2s; }
.ex-card.open .ex-arrow { transform:rotate(180deg); }

/* ══ SETS TABLE ══ */
.sets-wrap { padding:0 14px 16px; }
.sets-head {
  display:grid; grid-template-columns:38px 1fr 1fr 46px;
  gap:8px; padding:0 2px 8px;
  font-size:12px; font-weight:700; color:var(--txt3);
  text-transform:uppercase; letter-spacing:.8px; text-align:center;
}
.set-row {
  display:grid; grid-template-columns:38px 1fr 1fr 46px;
  gap:8px; margin-bottom:8px; align-items:center;
}
.set-badge {
  background:var(--bg3); border-radius:8px;
  font-size:14px; font-weight:800; color:var(--txt2);
  text-align:center; padding:13px 4px;
}
/* tap-zone input wrapper */
.inp-wrap {
  position:relative; display:flex; align-items:center;
  background:var(--bg3); border:1.5px solid var(--border2);
  border-radius:10px; overflow:hidden; transition:border-color .15s;
}
.inp-wrap:focus-within { border-color:var(--accent); background:#1a2240; }
.inp-tap {
  position:absolute; top:0; bottom:0; width:50%; z-index:2;
  background:transparent; border:none; cursor:pointer; -webkit-appearance:none;
  padding:0;
}
.inp-tap.left  { left:0; }
.inp-tap.right { right:0; }
.inp-tap:active { background:rgba(79,127,255,.08); }
.set-input {
  position:relative; z-index:1; pointer-events:none;
  background:transparent; border:none;
  padding:13px 6px;
  font-size:22px; font-weight:800; text-align:center;
  width:100%; color:var(--txt1); -webkit-appearance:none;
  outline:none;
}
/* allow typing when explicitly focused via JS */
.set-input.editable { pointer-events:auto; }
.set-del {
  background:#2a1520; border:none; border-radius:8px;
  color:var(--red); font-size:20px; font-weight:700;
  height:50px; width:46px; cursor:pointer; -webkit-appearance:none;
  display:flex; align-items:center; justify-content:center;
}
.set-del:active { background:#3a1a28; }
.btn-add-set {
  width:100%; padding:13px; border-radius:10px; cursor:pointer;
  background:transparent; border:1.5px dashed var(--border2);
  color:var(--txt2); font-size:14px; font-weight:700;
  margin-top:4px; -webkit-appearance:none; letter-spacing:.3px;
}
.btn-add-set:active { border-color:var(--accent); color:var(--accent); }

/* ══ ADD EXERCISE BUTTON ══ */
.btn-add-ex {
  width:100%; padding:16px; border-radius:var(--r); cursor:pointer;
  background:transparent; border:1.5px dashed var(--border2);
  color:var(--accent); font-size:16px; font-weight:800;
  margin-bottom:16px; -webkit-appearance:none; letter-spacing:.3px;
}
.btn-add-ex:active { background:#16203a; border-color:var(--accent); }

/* ══ PICKER ══ */
.picker-wrap {
  background:var(--bg2); border:1.5px solid var(--accent);
  border-radius:var(--r); padding:16px; margin-bottom:12px;
  animation:scaleIn .15s ease;
}
.picker-search {
  width:100%; background:var(--bg3); border:1.5px solid var(--border2);
  border-radius:10px; padding:14px 16px; font-size:16px; font-weight:500;
  color:var(--txt1); margin-bottom:16px; display:block;
}
.picker-search:focus { border-color:var(--accent); outline:none; }
.cat-title { font-size:12px; font-weight:800; color:var(--txt3);
  letter-spacing:1.5px; text-transform:uppercase; margin:0 0 10px; }
.chips-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.chip {
  background:var(--bg3); border:1.5px solid var(--border);
  border-radius:10px; padding:12px 10px;
  display:flex; align-items:center; gap:10px;
  cursor:pointer; -webkit-appearance:none;
  transition:border-color .12s, background .12s;
}
.chip:active { background:#1e2535; border-color:var(--accent); }
.chip-icon { font-size:22px; flex-shrink:0; }
.chip-name { font-size:14px; font-weight:700; color:var(--txt1); line-height:1.2; }
.btn-cancel {
  background:none; border:none; color:var(--txt3); cursor:pointer;
  font-size:14px; font-weight:600; padding:4px; -webkit-appearance:none;
  display:block; margin-top:4px;
}

/* ══ FINISH BAR ══ */
.finish-wrap { padding-top:4px; padding-bottom:8px; }
.btn-discard {
  display:block; margin:12px auto 0; background:none; border:none;
  color:var(--txt3); font-size:14px; font-weight:600; cursor:pointer;
  -webkit-appearance:none; text-decoration:underline;
}

/* ══ HISTORY ══ */
.hist-top { margin-bottom:20px; }
.page-title { font-family:'Barlow Condensed'; font-size:34px; font-weight:900;
  color:var(--txt1); letter-spacing:.5px; }
.page-sub { font-size:14px; color:var(--txt2); margin-top:4px; font-weight:500; }

.hist-card {
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:var(--r); margin-bottom:14px; overflow:hidden;
  animation:fadeUp .18s ease;
}
.hist-top-row { display:flex; justify-content:space-between; align-items:flex-start;
  padding:16px 16px 14px; border-bottom:1px solid var(--border); }
.hist-date { font-family:'Barlow Condensed'; font-size:22px; font-weight:900; color:var(--txt1); }
.hist-volume { font-size:13px; color:var(--txt2); margin-top:3px; font-weight:600; }
.hist-del {
  background:#2a1520; border:none; color:var(--red); cursor:pointer;
  font-size:18px; padding:8px 10px; border-radius:8px; -webkit-appearance:none;
}
.hist-del:active { background:#3a1a28; }
.hist-exs { padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.hist-ex { display:flex; align-items:flex-start; gap:12px; }
.hist-ex-icon { width:38px; height:38px; border-radius:10px; background:var(--bg3);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.hist-ex-body { flex:1; }
.hist-ex-name { font-size:15px; font-weight:700; color:var(--txt1); margin-bottom:6px; }
.hist-badges { display:flex; flex-wrap:wrap; gap:5px; }
.badge {
  background:var(--bg3); border:1px solid var(--border2);
  border-radius:7px; padding:5px 10px;
  font-size:13px; font-weight:700; color:var(--txt2);
}

/* ══ EMPTY STATES ══ */
.empty-center { text-align:center; padding-top:60px; }
.empty-em { font-size:48px; margin-bottom:12px; }
.empty-h { font-size:17px; font-weight:800; color:var(--txt2); }
.empty-p { font-size:14px; color:var(--txt3); margin-top:6px; font-weight:500; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="hdr-inner">
      <div class="logo-mark">IRON<span>LOG</span></div>
      <div class="nav-pills">
        <button class="nav-btn active" id="btn-log" onclick="showView('log')">Workout</button>
        <button class="nav-btn" id="btn-history" onclick="showView('history')">History</button>
      </div>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
/* ── DATA ── */
const PRESETS = {
  Chest:[
    {name:"Bench Press",icon:"🏋️"},{name:"Incline Press",icon:"📐"},
    {name:"Cable Fly",icon:"🦋"},{name:"Dips",icon:"⬇️"},{name:"Push-up",icon:"💪"},
  ],
  Back:[
    {name:"Deadlift",icon:"⚡"},{name:"Pull-up",icon:"🔝"},
    {name:"Barbell Row",icon:"🚣"},{name:"Lat Pulldown",icon:"⬇️"},{name:"Cable Row",icon:"🔗"},
  ],
  Legs:[
    {name:"Squat",icon:"🦵"},{name:"Romanian DL",icon:"⚡"},
    {name:"Leg Press",icon:"🦿"},{name:"Lunges",icon:"🚶"},{name:"Leg Curl",icon:"🔄"},
  ],
  Shoulders:[
    {name:"Overhead Press",icon:"🙌"},{name:"Lateral Raise",icon:"🦅"},
    {name:"Front Raise",icon:"⬆️"},{name:"Face Pull",icon:"🎯"},{name:"Shrug",icon:"🤷"},
  ],
  Arms:[
    {name:"Barbell Curl",icon:"💪"},{name:"Tricep Pushdown",icon:"⬇️"},
    {name:"Hammer Curl",icon:"🔨"},{name:"Skull Crusher",icon:"💀"},{name:"Preacher Curl",icon:"🙏"},
  ],
  Core:[
    {name:"Plank",icon:"🪵"},{name:"Crunch",icon:"🔁"},
    {name:"Leg Raise",icon:"🦵"},{name:"Russian Twist",icon:"🌀"},{name:"Ab Wheel",icon:"🎡"},
  ],
};
const ALL_EX = Object.values(PRESETS).flat();
const EX_ICON = {};
ALL_EX.forEach(e => EX_ICON[e.name] = e.icon);
const ikon = n => EX_ICON[n] || "🏃";

/* ── STATE ── */
let S = {
  view:"log",
  workouts: JSON.parse(localStorage.getItem("ironlog3") || "[]"),
  current: null,
  activeEx: null,
  showPicker: false,
  search: "",
  timer: null,
  timerInterval: null,
};
const save = () => localStorage.setItem("ironlog3", JSON.stringify(S.workouts));

/* ── UTILS ── */
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
const fmtShort = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const todayISO = () => new Date().toISOString().split("T")[0];
const todayStr = () => new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const vol = w => w.exercises.reduce((s,ex)=>s+ex.sets.reduce((ss,st)=>ss+(parseFloat(st.kg)||0)*(parseInt(st.reps)||0),0),0);
const sets = w => w.exercises.reduce((s,ex)=>s+ex.sets.length,0);

/* ── NAV ── */
function showView(v) {
  S.view = v;
  document.getElementById("btn-log").classList.toggle("active", v==="log");
  document.getElementById("btn-history").classList.toggle("active", v==="history");
  render();
}

/* ── WORKOUT ACTIONS ── */
function startWorkout() { S.current={date:todayISO(),exercises:[]}; S.activeEx=null; S.showPicker=false; render(); }

function discardWorkout() {
  if(!confirm("Discard this session?")) return;
  S.current=null; killTimer(); render();
}

function finishWorkout() {
  S.workouts.unshift(S.current); save();
  S.current=null; killTimer(); showView("history");
}

function addEx(name) {
  S.current.exercises.push({name,sets:[{reps:"",kg:""}]});
  S.activeEx = S.current.exercises.length-1;
  S.showPicker=false; S.search=""; render();
}

function toggleEx(i) { S.activeEx = S.activeEx===i ? null : i; render(); }

function addSet(ei) {
  const last = S.current.exercises[ei].sets.at(-1);
  S.current.exercises[ei].sets.push({reps:last.reps, kg:last.kg});
  startTimer(90); render();
}

function delSet(ei,si) {
  S.current.exercises[ei].sets.splice(si,1);
  if(!S.current.exercises[ei].sets.length) {
    S.current.exercises.splice(ei,1);
    if(S.activeEx >= S.current.exercises.length) S.activeEx=null;
  }
  render();
}

function upd(ei,si,f,v) { S.current.exercises[ei].sets[si][f]=v; }

function delWorkout(i) {
  if(!confirm("Delete session?")) return;
  S.workouts.splice(i,1); save(); render();
}

/* ── TIMER ── */
function startTimer(secs) {
  killTimer(); S.timer=secs;
  S.timerInterval = setInterval(()=>{
    if(S.timer>0){
      S.timer--;
      const el=document.getElementById("t-count");
      if(el){
        const m=Math.floor(S.timer/60), s=String(S.timer%60).padStart(2,"0");
        el.textContent=m+":"+s;
        el.style.color=S.timer<30?"#f87171":"#4f7fff";
        el.style.animation=S.timer<10?"pulse 1s infinite":"none";
      }
    } else killTimer();
  },1000);
}
function killTimer(){ clearInterval(S.timerInterval); S.timerInterval=null; S.timer=null; }

/* ── RENDER ── */
function render() {
  document.getElementById("content").innerHTML =
    S.view==="log" ? renderLog() : renderHistory();
}

function renderLog() { return S.current ? renderSession() : renderStart(); }

/* START SCREEN */
function renderStart() {
  const last = S.workouts[0];
  let lastHtml = "";
  if(last) {
    const exLine = last.exercises.map(e=>`${ikon(e.name)} ${e.name}`).join(" · ");
    lastHtml = `
      <div class="last-wrap">
        <div class="label-sm">Last Session</div>
        <div class="summary-card">
          <div class="summary-date">${fmtShort(last.date)}</div>
          <div class="summary-exs">${exLine}</div>
          <div class="summary-stats">
            <div class="stat-pill">
              <div class="stat-val">${vol(last).toLocaleString()}</div>
              <div class="stat-lbl">kg lifted</div>
            </div>
            <div class="stat-pill">
              <div class="stat-val">${last.exercises.length}</div>
              <div class="stat-lbl">exercises</div>
            </div>
            <div class="stat-pill">
              <div class="stat-val">${sets(last)}</div>
              <div class="stat-lbl">total sets</div>
            </div>
          </div>
        </div>
      </div>`;
  }
  return `<div class="page">
    <div class="start-hero">
      <div class="start-emoji">🏋️</div>
      <div class="start-h">READY TO LIFT?</div>
      <div class="start-date">${todayStr()}</div>
      <button class="btn-cta" onclick="startWorkout()">Start Workout</button>
    </div>
    ${lastHtml}
  </div>`;
}

/* ACTIVE SESSION */
function renderSession() {
  const w = S.current;
  const m=Math.floor((S.timer||0)/60), sec=String((S.timer||0)%60).padStart(2,"0");
  const timerHtml = S.timer!==null && S.timer>0
    ? `<div class="timer-box">
        <div class="timer-count" id="t-count" style="color:${S.timer<30?"#f87171":"#4f7fff"}">${m}:${sec}</div>
        <div class="timer-lbl">Rest</div>
       </div>`
    : `<button class="timer-box" onclick="startTimer(90)"><div style="font-size:22px">⏱</div><div class="timer-lbl">90s Rest</div></button>`;

  const exCards = w.exercises.map((ex,ei)=>{
    const open = S.activeEx===ei;
    const maxKg = Math.max(...ex.sets.map(s=>parseFloat(s.kg)||0));
    const totalSets = ex.sets.length;
    const subtext = `${totalSets} set${totalSets!==1?"s":""}${maxKg>0?" · "+maxKg+" kg max":""}`;

    const setsHtml = open ? `
      <div class="sets-wrap">
        <div class="sets-head"><div>#</div><div>REPS</div><div>KG</div><div></div></div>
        ${ex.sets.map((st,si)=>`
          <div class="set-row">
            <div class="set-badge">${si+1}</div>
            <div class="inp-wrap">
              <button class="inp-tap left"  onclick="nudge(${ei},${si},'reps',-1)"></button>
              <button class="inp-tap right" onclick="nudge(${ei},${si},'reps',+1)"></button>
              <input class="set-input" id="inp-r-${ei}-${si}" type="number" inputmode="numeric" placeholder="0"
                value="${st.reps}" oninput="upd(${ei},${si},'reps',this.value)"
                ondblclick="makeEditable(this)">
            </div>
            <div class="inp-wrap">
              <button class="inp-tap left"  onclick="nudge(${ei},${si},'kg',-2.5)"></button>
              <button class="inp-tap right" onclick="nudge(${ei},${si},'kg',+2.5)"></button>
              <input class="set-input" id="inp-k-${ei}-${si}" type="number" inputmode="decimal" placeholder="0"
                value="${st.kg}" oninput="upd(${ei},${si},'kg',this.value)"
                ondblclick="makeEditable(this)">
            </div>
            <button class="set-del" onclick="delSet(${ei},${si})">✕</button>
          </div>`).join("")}
        <button class="btn-add-set" onclick="addSet(${ei})">+ Add Set</button>
      </div>` : "";

    return `
      <div class="ex-card${open?" open":""}">
        <div class="ex-hdr" onclick="toggleEx(${ei})">
          <div class="ex-icon">${ikon(ex.name)}</div>
          <div class="ex-text">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-sub">${subtext}</div>
          </div>
          <div class="ex-arrow">▾</div>
        </div>
        ${setsHtml}
      </div>`;
  }).join("");

  const picker = S.showPicker ? renderPicker() :
    `<button class="btn-add-ex" onclick="openPicker()">+ Add Exercise</button>`;

  const finishRow = w.exercises.length>0 ? `
    <div class="finish-wrap">
      <button class="btn-cta green" onclick="finishWorkout()">✓ Finish Workout</button>
      <button class="btn-discard" onclick="discardWorkout()">Discard session</button>
    </div>` : "";

  return `<div class="page">
    <div class="sess-topbar">
      <div class="sess-left">
        <div class="sess-title">WORKOUT</div>
        <div class="sess-sub">${fmtShort(w.date)} · ${w.exercises.length} exercise${w.exercises.length!==1?"s":""}</div>
      </div>
      ${timerHtml}
    </div>
    ${exCards}
    ${picker}
    ${finishRow}
  </div>`;
}

/* PICKER */
function renderPicker() {
  const q = S.search.toLowerCase().trim();
  let body = "";
  if(q) {
    const hits = ALL_EX.filter(e=>e.name.toLowerCase().includes(q));
    body = hits.length
      ? `<div class="chips-grid">${hits.slice(0,12).map(e=>chipHtml(e)).join("")}</div>`
      : `<p style="color:var(--txt3);font-size:14px;font-weight:600;padding:4px 0">No match — press Enter to add custom</p>`;
  } else {
    body = Object.entries(PRESETS).map(([cat,exs])=>`
      <div class="cat-title">${cat}</div>
      <div class="chips-grid">${exs.map(e=>chipHtml(e)).join("")}</div>
    `).join("");
  }
  return `
    <div class="picker-wrap">
      <input class="picker-search" id="psearch" type="text" placeholder="🔍  Search exercise…"
        value="${S.search}" oninput="liveSearch(this.value)" onkeydown="pkDown(event)" autocomplete="off">
      <div id="plist">${body}</div>
      <button class="btn-cancel" onclick="closePicker()">Cancel</button>
    </div>`;
}

function chipHtml(e) {
  return `<button class="chip" onclick="addEx('${e.name.replace(/'/g,"\\'")}')">
    <span class="chip-icon">${e.icon}</span>
    <span class="chip-name">${e.name}</span>
  </button>`;
}

/* HISTORY */
function renderHistory() {
  const ws = S.workouts;
  let inner = "";
  if(!ws.length) {
    inner = `<div class="empty-center">
      <div class="empty-em">📋</div>
      <div class="empty-h">No sessions yet</div>
      <div class="empty-p">Finish your first workout to see it here</div>
    </div>`;
  } else {
    inner = ws.map((w,i)=>{
      const exRows = w.exercises.map(ex=>{
        const badges = ex.sets.map(st=>
          `<div class="badge">${st.reps||"—"} reps${st.kg?" × "+st.kg+"kg":""}</div>`
        ).join("");
        return `
          <div class="hist-ex">
            <div class="hist-ex-icon">${ikon(ex.name)}</div>
            <div class="hist-ex-body">
              <div class="hist-ex-name">${ex.name}</div>
              <div class="hist-badges">${badges}</div>
            </div>
          </div>`;
      }).join("");
      return `
        <div class="hist-card">
          <div class="hist-top-row">
            <div>
              <div class="hist-date">${fmtShort(w.date)}</div>
              <div class="hist-volume">${vol(w).toLocaleString()} kg · ${w.exercises.length} exercises · ${sets(w)} sets</div>
            </div>
            <button class="hist-del" onclick="delWorkout(${i})">🗑</button>
          </div>
          <div class="hist-exs">${exRows}</div>
        </div>`;
    }).join("");
  }
  return `<div class="page">
    <div class="hist-top">
      <div class="page-title">History</div>
      <div class="page-sub">${ws.length} session${ws.length!==1?"s":""} logged</div>
    </div>
    ${inner}
  </div>`;
}

/* PICKER HELPERS */
function openPicker() {
  S.showPicker=true; S.search=""; render();
  setTimeout(()=>{ const el=document.getElementById("psearch"); if(el) el.focus(); },60);
}
function closePicker() { S.showPicker=false; S.search=""; render(); }

function liveSearch(v) {
  S.search=v;
  const q=v.toLowerCase().trim();
  const list=document.getElementById("plist"); if(!list) return;
  if(q) {
    const hits=ALL_EX.filter(e=>e.name.toLowerCase().includes(q));
    list.innerHTML = hits.length
      ? `<div class="chips-grid">${hits.slice(0,12).map(e=>chipHtml(e)).join("")}</div>`
      : `<p style="color:var(--txt3);font-size:14px;font-weight:600;padding:4px 0">No match — press Enter to add</p>`;
  } else {
    list.innerHTML = Object.entries(PRESETS).map(([cat,exs])=>`
      <div class="cat-title">${cat}</div>
      <div class="chips-grid">${exs.map(e=>chipHtml(e)).join("")}</div>
    `).join("");
  }
}

function pkDown(e) {
  const v=document.getElementById("psearch")?.value?.trim();
  if(e.key==="Enter" && v) addEx(v);
  if(e.key==="Escape") closePicker();
}

/* ── TAP-ZONE NUDGE ── */
function nudge(ei, si, field, delta) {
  const set = S.current.exercises[ei].sets[si];
  let cur = parseFloat(set[field]) || 0;
  if (field === 'reps') {
    cur = Math.max(0, Math.round(cur + delta));
    set[field] = cur === 0 ? "" : String(cur);
  } else {
    cur = cur + delta;
    cur = Math.max(0, Math.round(cur * 10) / 10);
    // snap to nearest 0.5 so 2.5 increments stay clean
    cur = Math.round(cur / 0.5) * 0.5;
    set[field] = cur === 0 ? "" : String(cur);
  }
  // update DOM directly — avoids full re-render & scroll jump
  const id = field === 'reps' ? `inp-r-${ei}-${si}` : `inp-k-${ei}-${si}`;
  const el = document.getElementById(id);
  if (el) el.value = set[field];
  // flash border as visual feedback
  const wrap = el?.closest('.inp-wrap');
  if (wrap) {
    wrap.style.borderColor = 'var(--accent)';
    wrap.style.transition = 'border-color 0s';
    setTimeout(() => {
      wrap.style.transition = 'border-color .3s';
      wrap.style.borderColor = '';
    }, 120);
  }
}

/* double-tap to type a value manually */
function makeEditable(input) {
  input.classList.add('editable');
  input.focus();
  input.select();
  input.addEventListener('blur', () => input.classList.remove('editable'), { once: true });
}

render();
</script>
</body>
